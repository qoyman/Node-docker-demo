name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag node-app-demo:latest

    - name: Run the Docker container
      run: docker run -d -p 3000:3000 --name node-app node-app-demo:latest

    - name: Test the endpoint
      run: curl http://localhost:3000/

    - name: Download with retries
      run: |
            curl --retry 5 \
                 --retry-all-errors \
                 --retry-delay 3 \
                 --fail \
                 --location \
                 --show-error \
                 --output <output-file> \
                 "<download-url>"


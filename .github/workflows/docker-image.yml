name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag node-app-demo:latest

    - name: Run the Docker container
      run: docker run -d -p 3000:3000 --name node-app node-app-demo:latest

    - name: Test the endpoint
      run: |
            for i in {1..10}; do
              curl --fail --retry 5 --retry-all-errors --retry-delay 3 \
                http://localhost:3000/ && exit 0
              sleep 3
            done
            docker logs node-app
            exit 1


    - name: Build and push Docker image
      uses: mr-smithers-excellent/docker-build-push@v7
      with:
        image: qoyman/my-first-docker-image
        registry: docker.io
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        

